# 1.36.1 I64: manual, one-off сын/дочь → бен/бат normalisation of existing deceased names.
# Writes only from main, only when dispatched by someone with write access. Apply requires typing APPLY.
name: Name normalization (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run | apply | restore'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply, restore]
      rule:
        description: 'ben-bat (сын/дочь → бен/бат) | patronymic (…овна → бат …) | drop-patronymic-dup (…ович бен … → бен …)'
        required: false
        default: ben-bat
        type: choice
        options: [ben-bat, patronymic, drop-patronymic-dup]
      result_pubkey:
        description: 'optional: base64 RSA public key PEM — rows go to an encrypted artifact, log shows counts only'
        required: false
        default: ''
      gender_fix:
        description: 'patronymic only: approved gender corrections by id, e.g. novosibirsk:202=female,kazan:21=female'
        required: false
        default: ''
      run_id:
        description: 'runId to restore (restore mode only)'
        required: false
        default: ''
      confirm:
        description: 'Type APPLY to allow apply/restore'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: name-normalization
  cancel-in-progress: false
jobs:
  run:
    # dry-run (read-only) may run from any branch; apply/restore only from main.
    if: github.ref == 'refs/heads/main' || inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - run: npm ci
      - name: Normalize
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          CONFIRM: ${{ inputs.confirm }}
          RULE: ${{ inputs.rule || 'ben-bat' }}
          RESULT_PUBKEY: ${{ inputs.result_pubkey }}
          GENDER_FIX: ${{ inputs.gender_fix }}
        run: |
          if [ "$MODE" != "dry-run" ] && [ "$CONFIRM" != "APPLY" ]; then
            echo "Refusing $MODE without confirm=APPLY"; exit 1
          fi
          ENC=""
          if [ -n "$RESULT_PUBKEY" ]; then ENC="--encrypt-to=normalization-result.enc.json"; fi
          node scripts/run-name-normalization.js --mode="$MODE" --rule="$RULE" --run-id="$RUN_ID" --gender-fix="$GENDER_FIX" $ENC
      - name: Upload encrypted result
        if: ${{ inputs.result_pubkey != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: normalization-result-encrypted
          path: normalization-result.enc.json
          retention-days: 1
