# No automatic rollback. Amvera deploys from main; rolling back is not simple or safe.
# PROD_URL is the repository variable PROD_URL, otherwise the Warsaw production host.
name: Post-deploy check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ vars.PROD_URL != '' && vars.PROD_URL || 'https://synagogue-kadish-waw-shneur.waw0.amvera.tech' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for version and check boards
        run: |
          set -euo pipefail
          FAIL_FILE="${RUNNER_TEMP}/post-deploy-failures.txt"
          : > "$FAIL_FILE"
          BASE="${PROD_URL%/}"
          EXPECTED="$(node -e "const c=require('./CHANGELOG.json'); process.stdout.write(String((c[0]||{}).version||''))")"
          echo "expected_version=${EXPECTED}"
          deadline=$((SECONDS + 600))
          matched=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS --max-time 20 "${BASE}/healthz" || true)"
            ver="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const v=JSON.parse(s).version;process.stdout.write(typeof v==='string'?v:'')}catch(e){}})")"
            echo "healthz_version=${ver:-missing}"
            if [ -n "$EXPECTED" ] && [ "$ver" = "$EXPECTED" ]; then
              matched=1
              break
            fi
            sleep 20
          done
          if [ "$matched" -ne 1 ]; then
            echo "healthz version_mismatch" | tee -a "$FAIL_FILE"
          fi
          slug_file="${RUNNER_TEMP}/community-slugs.json"
          code="$(curl -sS --max-time 20 -o "$slug_file" -w '%{http_code}' "${BASE}/api/public/community-slugs" || echo 000)"
          echo "community_slugs_http=${code}"
          node -e "
            const fs=require('fs');
            const {normalizeCommunitySlugs}=require('./lib/community-slugs');
            let rows=[];
            try { const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); rows=Array.isArray(j)?j:(j.slugs||[]); } catch (e) { rows=[]; }
            let slugs=normalizeCommunitySlugs(rows);
            if (!slugs.length || process.argv[3] !== '200') {
              const fb=JSON.parse(fs.readFileSync('scripts/community-slugs.json','utf8'));
              slugs=normalizeCommunitySlugs(fb);
            }
            fs.writeFileSync(process.argv[2], slugs.join('\n'));
          " "$slug_file" "${RUNNER_TEMP}/slugs.txt" "$code"
          if [ ! -s "${RUNNER_TEMP}/slugs.txt" ]; then
            echo "slugs none" | tee -a "$FAIL_FILE"
          fi
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            status="$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "${BASE}/s/${slug}" || echo 000)"
            echo "slug=${slug} status=${status}"
            if [ "$status" != "200" ]; then
              echo "slug=${slug} status=${status}" >> "$FAIL_FILE"
            fi
          done < "${RUNNER_TEMP}/slugs.txt"
          if [ -s "$FAIL_FILE" ]; then
            exit 1
          fi

      - name: Open or update issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.RUNNER_TEMP, 'post-deploy-failures.txt');
            const detail = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim() : '';
            const body = [
              'Post-deploy check failed.',
              '',
              detail || 'No status lines were recorded.',
              '',
              'No automatic rollback (Amvera deploys from main).',
            ].join('\n');
            const title = 'Post-deploy check failed';
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
