name: Deploy GitHub Pages Fallback

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Export MongoDB snapshots
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -n "$MONGODB_URI" ]; then
            echo "📦 Exporting fresh snapshots from MongoDB..."
            node scripts/export-static-snapshot.js
          else
            echo "⚠️  MONGODB_URI not configured, using committed snapshots"
            if [ ! -d "static-snapshots" ] || [ -z "$(ls -A static-snapshots/*.json 2>/dev/null)" ]; then
              echo "❌ No committed snapshots found and MONGODB_URI not available"
              exit 1
            fi
          fi
      
      - name: Commit updated snapshots
        if: env.MONGODB_URI != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add static-snapshots/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update static snapshots [skip ci]"
            git push
          fi
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      
      - name: Build GitHub Pages site
        run: node scripts/build-github-pages-fallback.js
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
